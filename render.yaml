services:
  - type: web
    name: nexo-clientes-pedidos
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./src/OrderDesk.Web/Dockerfile
    dockerContext: ./src/OrderDesk.Web
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__PostgreSQL
        fromDatabase:
          name: nexo-postgres
          property: connectionString
      - key: ExternalApi__BaseUrl
        value: https://nexo-external-api.onrender.com
      - key: Webhook__Secret
        generateValue: true
      - key: SeedAdmin__Email
        value: admin@nexo.local
      - key: SeedAdmin__Password
        generateValue: true
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      - key: Twilio__AccountSid
        sync: false
      - key: Twilio__AuthToken
        sync: false
      - key: Twilio__WhatsAppFrom
        sync: false

  - type: web
    name: nexo-external-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./src/OrderDesk.ExternalApi/Dockerfile
    dockerContext: ./src/OrderDesk.ExternalApi
    healthCheckPath: /health

databases:
  - name: nexo-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: orderdesk
    user: orderdesk
    ipAllowList: []
